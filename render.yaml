services:
  - type: web
    name: wild-horizon-backend
    env: node
    region: oregon
    plan: free
    branch: main
    buildCommand: rm -rf node_modules Backend/node_modules && npm ci && npm run build --workspace=Backend
    startCommand: npm start --workspace=Backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: FRONTEND_URL
        value: https://horizontourists.netlify.app
